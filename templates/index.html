<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📰 AIニュースサマリー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, #1a1f2e 0%, #16213e 100%);
      border-bottom: 1px solid #2d3748;
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-title h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f7fafc;
    }

    .header-title .date {
      font-size: 0.9rem;
      color: #a0aec0;
      margin-top: 2px;
    }

    .fetch-btn {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .fetch-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(79, 70, 229, 0.4);
    }

    .fetch-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .container {
      max-width: 860px;
      margin: 40px auto;
      padding: 0 24px;
    }

    /* 状態表示エリア */
    #status {
      display: none;
      align-items: center;
      gap: 10px;
      background: #1e2535;
      border: 1px solid #2d3748;
      border-radius: 10px;
      padding: 14px 20px;
      margin-bottom: 24px;
      font-size: 0.95rem;
      color: #90cdf4;
    }

    #status.visible { display: flex; }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid #4f46e5;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ニュース出力エリア */
    #output {
      background: #1a1f2e;
      border: 1px solid #2d3748;
      border-radius: 14px;
      padding: 32px;
      min-height: 200px;
      line-height: 1.8;
      display: none;
    }

    #output.visible { display: block; }

    /* Markdown スタイル */
    #output h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #90cdf4;
      margin: 28px 0 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #2d3748;
    }

    #output h2:first-child { margin-top: 0; }

    #output h3 {
      font-size: 1.05rem;
      font-weight: 600;
      color: #bee3f8;
      margin: 18px 0 6px;
    }

    #output p {
      color: #cbd5e0;
      margin-bottom: 10px;
    }

    #output strong {
      color: #e2e8f0;
      font-weight: 600;
    }

    #output ol, #output ul {
      padding-left: 20px;
      margin-bottom: 12px;
    }

    #output li {
      color: #cbd5e0;
      margin-bottom: 6px;
    }

    /* フッター（使用トークン） */
    #usage {
      display: none;
      margin-top: 20px;
      padding: 12px 20px;
      background: #1e2535;
      border: 1px solid #2d3748;
      border-radius: 10px;
      font-size: 0.85rem;
      color: #718096;
      text-align: right;
    }

    #usage.visible { display: block; }

    /* エラー */
    #error {
      display: none;
      padding: 16px 20px;
      background: #1a1010;
      border: 1px solid #742a2a;
      border-radius: 10px;
      color: #fc8181;
      margin-bottom: 24px;
    }

    #error.visible { display: block; }

    /* 初期状態のプレースホルダー */
    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      color: #4a5568;
      text-align: center;
      gap: 12px;
    }

    .placeholder .icon { font-size: 3rem; }
    .placeholder p { font-size: 1rem; }
  </style>
</head>
<body>

<header>
  <div class="header-title">
    <div>
      <h1>📰 AIニュースサマリー</h1>
      <div class="date">{{ today }}</div>
    </div>
  </div>
  <button class="fetch-btn" id="fetchBtn" onclick="fetchNews()">
    <span>🔄</span> ニュースを取得
  </button>
</header>

<div class="container">

  <div id="status">
    <div class="spinner"></div>
    <span id="statusText">AIニュースを取得中...</span>
  </div>

  <div id="error"></div>

  <div id="output">
    <div class="placeholder">
      <div class="icon">🤖</div>
      <p>「ニュースを取得」ボタンを押すと、<br>最新のAIニュース10件をまとめます</p>
    </div>
  </div>

  <div id="usage"></div>

</div>

<script>
  // シンプルなMarkdownパーサー
  function parseMarkdown(text) {
    return text
      .replace(/^## (.+)$/gm, '<h2>$1</h2>')
      .replace(/^### (.+)$/gm, '<h3>$1</h3>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
      .replace(/(<li>.*<\/li>\n?)+/g, (m) => `<ol>${m}</ol>`)
      .replace(/^- (.+)$/gm, '<li>$1</li>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/^(?!<[hol])/gm, '')
      .trim();
  }

  function fetchNews() {
    const btn = document.getElementById('fetchBtn');
    const status = document.getElementById('status');
    const statusText = document.getElementById('statusText');
    const output = document.getElementById('output');
    const usage = document.getElementById('usage');
    const error = document.getElementById('error');

    // 初期化
    btn.disabled = true;
    status.classList.add('visible');
    statusText.textContent = 'AIニュースを取得中...';
    output.classList.add('visible');
    output.innerHTML = '';
    usage.classList.remove('visible');
    error.classList.remove('visible');
    error.textContent = '';

    let rawText = '';

    const evtSource = new EventSource('/stream');

    evtSource.onmessage = (e) => {
      const data = JSON.parse(e.data);

      if (data.type === 'searching') {
        statusText.textContent = '🔍 ウェブ検索中...';

      } else if (data.type === 'text') {
        statusText.textContent = '✍️ まとめを生成中...';
        rawText += data.text;
        // リアルタイムでレンダリング
        output.innerHTML = `<p>${parseMarkdown(rawText)}</p>`;
        // 自動スクロール
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

      } else if (data.type === 'done') {
        evtSource.close();
        status.classList.remove('visible');
        btn.disabled = false;
        usage.classList.add('visible');
        usage.textContent =
          `入力トークン: ${data.usage.input_tokens.toLocaleString()} ／ 出力トークン: ${data.usage.output_tokens.toLocaleString()}`;

      } else if (data.type === 'error') {
        evtSource.close();
        status.classList.remove('visible');
        btn.disabled = false;
        output.classList.remove('visible');
        error.classList.add('visible');
        error.textContent = '❌ ' + data.message;
      }
    };

    evtSource.onerror = () => {
      evtSource.close();
      status.classList.remove('visible');
      btn.disabled = false;
      error.classList.add('visible');
      error.textContent = '❌ 接続エラーが発生しました。再試行してください。';
    };
  }
</script>

</body>
</html>
