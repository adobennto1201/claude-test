<title>ヤドリの灯</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: a lacquered "lantern box" handheld — screen in a vermilion frame, controls below. Deliberately single night theme. */
:root{
  --night:#1c1a29;      /* page / case */
  --night-hi:#29263b;
  --frame:#8e3b25;      /* vermilion lacquer frame */
  --frame-hi:#a9502f;
  --ink:#f1e3c4;        /* paper-colored labels */
  --ink-dim:#a89c86;
  --btn:#121019;
  --btn-a:#c9822f;      /* amber buttons */
  --font-pixel:"DotGothic16", "Hiragino Kaku Gothic ProN", "Noto Sans JP", monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--ink);font-family:var(--font-pixel);margin:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
.wrap{max-width:680px;margin:0 auto;padding-block:14px 24px;display:flex;flex-direction:column;gap:14px;align-items:center}
header{width:100%;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
h1{font-size:20px;margin:0;letter-spacing:.12em;font-weight:400}
h1 span{color:var(--ink-dim);font-size:12px;margin-left:8px;letter-spacing:.06em}
.tools{display:flex;gap:8px}
.tools button{font:inherit;font-size:12px;color:var(--ink);background:var(--night-hi);border:1px solid var(--frame);border-radius:6px;padding:4px 10px;cursor:pointer}
.tools button:focus-visible,.pad button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.frame{background:linear-gradient(var(--frame-hi),var(--frame));padding:12px;border-radius:14px;width:100%;box-sizing:border-box;
  max-width:min(680px, calc((100dvh - 240px) * 1.111 + 24px));min-width:min(100%, 300px);box-shadow:0 0 40px rgba(201,130,47,.18)}
.frame .lbl{font-size:10px;color:var(--ink);opacity:.75;letter-spacing:.3em;margin:0 0 8px 2px;display:flex;justify-content:space-between}
canvas{display:block;width:100%;height:auto;aspect-ratio:320/288;image-rendering:pixelated;image-rendering:crisp-edges;background:#f6ecd2;border-radius:3px;max-width:100%}
.pad{width:100%;max-width:520px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px;touch-action:none}
.dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px)}
.dpad button,.ab button,.ss button{font:inherit;color:var(--ink);border:none;cursor:pointer;touch-action:none}
.dpad button{background:var(--btn);font-size:14px}
.dpad .u{grid-column:2;grid-row:1;border-radius:6px 6px 0 0}
.dpad .l{grid-column:1;grid-row:2;border-radius:6px 0 0 6px}
.dpad .c{grid-column:2;grid-row:2;background:var(--btn);pointer-events:none}
.dpad .r{grid-column:3;grid-row:2;border-radius:0 6px 6px 0}
.dpad .d{grid-column:2;grid-row:3;border-radius:0 0 6px 6px}
.ss{display:flex;gap:10px;justify-content:center;align-self:end;padding-bottom:6px}
.ss button{background:var(--btn);font-size:11px;letter-spacing:.1em;padding:6px 12px;border-radius:12px}
.ab{display:flex;gap:12px;transform:rotate(-18deg)}
.ab button{width:54px;height:54px;border-radius:50%;background:var(--btn-a);color:var(--btn);font-size:16px}
.pad button.on{filter:brightness(1.5)}
.help{font-size:12px;color:var(--ink-dim);line-height:1.9;text-align:center;max-width:60ch}
.help kbd{font-family:inherit;color:var(--ink);background:var(--night-hi);border:1px solid var(--frame);border-radius:4px;padding:0 5px}
@media (max-width:420px){.dpad{grid-template-columns:repeat(3,40px);grid-template-rows:repeat(3,40px)}.ab button{width:48px;height:48px}}
</style>

<main class="wrap">
  <header>
    <h1>ヤドリの灯<span>だいいっしょう ひだまりの村</span></h1>
    <div class="tools"><button id="mute" type="button">おと：オン</button></div>
  </header>
  <div class="frame">
    <p class="lbl"><span>ともしび がたり</span><span>◆</span></p>
    <canvas id="scr" width="320" height="288" tabindex="0" aria-label="ゲーム画面"></canvas>
  </div>
  <div class="pad" aria-label="コントローラー">
    <div class="dpad">
      <button class="u" data-k="up" aria-label="うえ">▲</button>
      <button class="l" data-k="left" aria-label="ひだり">◀</button>
      <span class="c"></span>
      <button class="r" data-k="right" aria-label="みぎ">▶</button>
      <button class="d" data-k="down" aria-label="した">▼</button>
    </div>
    <div class="ss"><button data-k="start" aria-label="メニュー">MENU</button></div>
    <div class="ab"><button data-k="b" aria-label="Bボタン">B</button><button data-k="a" aria-label="Aボタン">A</button></div>
  </div>
  <p class="help"><kbd>←↑↓→</kbd>/<kbd>WASD</kbd> いどう　<kbd>Z</kbd>/<kbd>Space</kbd> けってい・しらべる　<kbd>X</kbd>/<kbd>Esc</kbd> もどる　<kbd>Enter</kbd> メニュー<br>けっていキーを おしっぱなしで もじおくり。 きろくは メニューの「にっき」から。</p>
</main>

<script>
'use strict';
// =====================================================================
//  ヤドリの灯 — an original island-folklore spirit RPG (chapter 1)
//  World, spirits, five-element types, story, art and music are all original.
// =====================================================================
const cv=document.getElementById('scr'), ctx=cv.getContext('2d');
const W=320,H=288,TS=32;
const PAL=['#f6ecd2','#d9a25c','#8b472c','#2a1712'];   // paper, lantern amber, lacquer, ink
const FONT='16px "DotGothic16", monospace', FONT_S='12px "DotGothic16", monospace', FONT_L='32px "DotGothic16", monospace';
ctx.imageSmoothingEnabled=false;
let FR=0;
const rnd=Math.random, ri=(a,b)=>a+Math.floor(rnd()*(b-a+1)), pick=a=>a[Math.floor(rnd()*a.length)];

// ============================== INPUT ==============================
const K={up:0,down:0,left:0,right:0,a:0,b:0,start:0}, VK={...K}, TAP={}, HOLD={};
let CUR={},PREV={};
const KEYMAP={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',
  KeyZ:'a',Space:'a',KeyJ:'a',KeyX:'b',Escape:'b',Backspace:'b',KeyK:'b',Enter:'start',KeyC:'start'};
addEventListener('keydown',e=>{
  if(e.code==='KeyM'){toggleMute();return;}
  const k=KEYMAP[e.code]; if(!k) return; e.preventDefault(); if(!K[k]) TAP[k]=1; K[k]=1; unlockAudio();
});
addEventListener('keyup',e=>{const k=KEYMAP[e.code]; if(k){K[k]=0;e.preventDefault();}});
addEventListener('blur',()=>{for(const k in K){K[k]=0;VK[k]=0;}});
document.querySelectorAll('.pad button[data-k]').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();unlockAudio(); if(!VK[k]) TAP[k]=1; VK[k]=1; b.classList.add('on'); try{b.setPointerCapture(e.pointerId)}catch(_){}};
  const off=e=>{VK[k]=0;b.classList.remove('on');};
  b.addEventListener('pointerdown',on); b.addEventListener('pointerup',off); b.addEventListener('pointercancel',off); b.addEventListener('lostpointercapture',off);
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
function pollInput(){for(const k in K){CUR[k]=(K[k]||VK[k]||TAP[k])?1:0; HOLD[k]=CUR[k]?(HOLD[k]||0)+1:0; TAP[k]=0;}}
function endInput(){PREV={...CUR};}
const pressed=k=>CUR[k]&&!PREV[k];
const held=k=>!!CUR[k];
const rep=k=>pressed(k)||(HOLD[k]>18&&HOLD[k]%5===0);

// ============================== AUDIO ==============================
const AU={ctx:null,muted:false,sfx:null,mus:null};
function unlockAudio(){
  if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume();return;}
  try{
    AU.ctx=new (window.AudioContext||window.webkitAudioContext)();
    const m=AU.ctx.createGain(); m.gain.value=.16; m.connect(AU.ctx.destination);
    AU.sfx=AU.ctx.createGain(); AU.sfx.connect(m);
    AU.mus=AU.ctx.createGain(); AU.mus.gain.value=.55; AU.mus.connect(m);
    Music.next=AU.ctx.currentTime+.05;
  }catch(e){AU.ctx=null;}
}
const muteBtn=document.getElementById('mute');
function toggleMute(){AU.muted=!AU.muted; muteBtn.textContent='おと：'+(AU.muted?'オフ':'オン'); if(AU.ctx){AU.mus.gain.value=AU.muted?0:.55;AU.sfx.gain.value=AU.muted?0:1;}}
muteBtn.addEventListener('click',()=>{unlockAudio();toggleMute();});
function tone(f,dur,{type='square',vol=.5,when=0,slide=0,dest}={}){
  if(!AU.ctx||!f) return; const t=AU.ctx.currentTime+when;
  const o=AU.ctx.createOscillator(),g=AU.ctx.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g); g.connect(dest||AU.sfx); o.start(t); o.stop(t+dur+.03);
}
let NOISE=null;
function noise(dur,vol=.5,when=0){
  if(!AU.ctx) return;
  if(!NOISE){NOISE=AU.ctx.createBuffer(1,AU.ctx.sampleRate,AU.ctx.sampleRate);const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rnd()*2-1;}
  const s=AU.ctx.createBufferSource(),g=AU.ctx.createGain(),t=AU.ctx.currentTime+when; s.buffer=NOISE;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur); s.connect(g); g.connect(AU.sfx); s.start(t); s.stop(t+dur+.02);
}
const NF=n=>{const m=/^([A-G])(#?)(\d)$/.exec(n); if(!m) return 0; const i={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0); return 440*Math.pow(2,(i+12*(+m[3]+1)-69)/12);};
function seq(notes,step,{type='square',vol=.4,when=0}={}){notes.split(' ').forEach((n,i)=>{if(n!=='.'&&n!=='-')tone(NF(n),step*.95,{type,vol,when:when+i*step});});return notes.split(' ').length*step;}
const SFX={
  blip:()=>tone(1320,.035,{vol:.18}),
  bump:()=>tone(110,.09,{vol:.4,type:'square'}),
  door:()=>{noise(.12,.3);tone(300,.1,{vol:.2,slide:-150});},
  hit:()=>{noise(.18,.7);tone(160,.12,{vol:.3,slide:-80});},
  weak:()=>noise(.1,.35),
  super:()=>{noise(.25,.8);tone(90,.2,{vol:.4,slide:-40});},
  faint:()=>tone(700,.6,{vol:.3,slide:-620}),
  alert:()=>{tone(1500,.06,{vol:.3});tone(1900,.08,{vol:.3,when:.07});},
  ball:()=>tone(500,.25,{vol:.3,slide:500}),
  shake:()=>{tone(220,.06,{vol:.3});tone(180,.06,{vol:.3,when:.08});},
  stat:(up)=>tone(up?400:800,.25,{vol:.25,slide:up?600:-500}),
  status:()=>{for(let i=0;i<4;i++)tone(600+i*120,.05,{vol:.2,when:i*.05});},
  menu:()=>tone(990,.04,{vol:.2}),
  buy:()=>{tone(1300,.06,{vol:.25});tone(1700,.1,{vol:.25,when:.07});},
  jump:()=>tone(300,.15,{vol:.3,slide:300}),
  run:()=>{tone(400,.08,{vol:.2});tone(600,.08,{vol:.2,when:.08});tone(900,.1,{vol:.2,when:.16});},
};
// --- background music (original tunes) ---
const SONGS={
  town:{s:.17,m:'E5 - G5 - C6 - B5 A5 G5 - E5 - D5 - - - E5 - G5 - A5 - G5 E5 D5 - C5 - D5 - - - E5 - G5 - C6 - D6 C6 B5 - A5 - G5 - - - A5 - G5 E5 F5 - E5 C5 D5 - G4 - C5 - - -',
            b:'C3 - G3 - C3 - G3 - A2 - E3 - G2 - D3 - F2 - C3 - F2 - C3 - G2 - D3 - G2 - B2 - C3 - G3 - C3 - G3 - E3 - B3 - A2 - E3 - F2 - C3 - F2 - A2 - G2 - D3 - C3 - G2 -'},
  route:{s:.15,m:'G4 A4 B4 D5 - B4 D5 G5 - - F#5 E5 D5 - B4 - C5 - E5 - D5 C5 B4 - A4 B4 C5 - D5 - - - G4 A4 B4 D5 - B4 D5 G5 - - A5 G5 F#5 - D5 - E5 - G5 F#5 E5 D5 C5 B4 A4 - G4 - - - - -',
            b:'G2 - D3 - G2 - D3 - C3 - G3 - D3 - A3 - E2 - B2 - C3 - G3 - D3 - A2 - D3 - F#3 - G2 - D3 - G2 - D3 - C3 - G3 - D3 - A3 - C3 - G3 - D3 - A3 - G2 - D3 - G2 - - -'},
  forest:{s:.19,m:'A4 - C5 - E5 - D5 C5 B4 - G4 - A4 - - - C5 - E5 - G5 - F5 E5 D5 - B4 - A4 - - - E5 - D5 - C5 - B4 C5 D5 - G4 - A4 - - - F4 - A4 - C5 - B4 A4 G#4 - B4 - A4 - - -',
            b:'A2 - E3 - A2 - E3 - G2 - D3 - G2 - D3 - F2 - C3 - F2 - C3 - E2 - B2 - E2 - B2 - A2 - E3 - A2 - E3 - G2 - D3 - G2 - D3 - F2 - C3 - D2 - A2 - E2 - B2 - A2 - E3 -'},
  battle:{s:.115,m:'A4 A4 C5 A4 D5 A4 C5 A4 E5 D5 C5 B4 C5 - B4 - A4 A4 C5 A4 D5 A4 E5 A4 G5 F5 E5 D5 E5 - - - F5 E5 D5 C5 D5 C5 B4 A4 B4 C5 D5 E5 F5 - E5 - D5 C5 B4 A4 G#4 A4 B4 C5 E5 - D5 - C5 - B4 -',
            b:'A2 A3 A2 A3 A2 A3 A2 A3 F2 F3 F2 F3 G2 G3 G2 G3 A2 A3 A2 A3 A2 A3 A2 A3 F2 F3 G2 G3 E2 E3 E2 E3 D2 D3 D2 D3 D2 D3 D2 D3 F2 F3 F2 F3 G2 G3 G2 G3 E2 E3 E2 E3 E2 E3 E2 E3 A2 A3 A2 A3 E2 E3 G#2 G#3'},
  leader:{s:.11,m:'E5 E5 - E5 G5 - E5 - D5 D5 - D5 C5 - D5 - E5 E5 - E5 A5 - G5 - E5 - D5 - E5 - - - C5 C5 - C5 E5 - C5 - B4 B4 - B4 D5 - B4 - C5 D5 E5 G5 A5 G5 E5 D5 E5 - - - B4 - - -',
            b:'A2 A3 A2 A3 A2 A3 A2 A3 G2 G3 G2 G3 G2 G3 G2 G3 F2 F3 F2 F3 F2 F3 F2 F3 E2 E3 E2 E3 E2 E3 E2 E3 F2 F3 F2 F3 F2 F3 F2 F3 G2 G3 G2 G3 G2 G3 G2 G3 A2 A3 A2 A3 C3 C4 C3 C4 E2 E3 E2 E3 E2 E3 E2 E3'},
  center:{s:.16,m:'C5 E5 G5 E5 F5 A5 C6 - B5 G5 D5 G5 C5 - - - C5 E5 G5 E5 F5 A5 C6 - D6 B5 G5 B5 C6 - - -',
            b:'C3 - G3 - F3 - A3 - G3 - D3 - C3 - G2 - C3 - G3 - F3 - A3 - G3 - G2 - C3 - - -'},
  gym:{s:.14,m:'D5 - A4 - D5 E5 F5 - E5 - C5 - A4 - - - D5 - A4 - D5 E5 F5 - G5 - F5 E5 D5 - - - F5 - E5 - D5 - C5 - A#4 - C5 - D5 - - - E5 - F5 - G5 - A5 - F5 - E5 - D5 - - -',
            b:'D3 - A2 - D3 - A2 - C3 - G2 - C3 - G2 - A#2 - F2 - A#2 - F2 - A2 - E2 - A2 - E2 - D3 - A2 - D3 - A2 - C3 - G2 - C3 - G2 - A#2 - F2 - A2 - E2 - D3 - - - D3 - - -'},
  victory:{s:.13,once:true,m:'G5 G5 G5 - E5 - G5 - C6 - - - - - - - A5 - A5 - G5 - E5 - G5 - - - - - - -',b:'C3 - C3 - G2 - C3 - F2 - G2 - C3 - - - F2 - F2 - C3 - G2 - C3 - - - - - - -'},
};
for(const k in SONGS){const s=SONGS[k];['m','b'].forEach(t=>{const toks=s[t].split(' ');const arr=[];toks.forEach((n,i)=>{if(n==='-'||n==='.'){arr.push(null);return;}let len=1;while(toks[i+len]==='-')len++;arr.push({f:NF(n),len});});s[t+'a']=arr;});}
const Music={cur:null,i:0,next:0,paused:0,
  play(n){if(this.cur===n)return;this.cur=n;this.i=0;if(AU.ctx)this.next=AU.ctx.currentTime+.06;},
  stop(){this.cur=null;},
  tick(){
    if(!AU.ctx||!this.cur) return; const s=SONGS[this.cur]; const now=AU.ctx.currentTime;
    if(this.paused>now){this.next=this.paused;return;}
    if(this.next<now-.5) this.next=now+.05;
    while(this.next<now+.25){
      const L=s.ma.length;
      if(s.once&&this.i>=L){this.cur=null;return;}
      const m=s.ma[this.i%L], b=s.ba[this.i%s.ba.length], w=this.next-now;
      if(m) tone(m.f,s.s*m.len*.9,{vol:.32,when:w,dest:AU.mus});
      if(b) tone(b.f,s.s*b.len*.95,{type:'triangle',vol:.6,when:w,dest:AU.mus});
      this.next+=s.s; this.i++;
    }
  }};
function jingle(notes,step,opts){ if(!AU.ctx) return; const d=seq(notes,step,opts); Music.paused=AU.ctx.currentTime+d+.1; }

// ============================== GRAPHICS ==============================
function cnv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function paint(g,rows,ox=0,oy=0){for(let y=0;y<rows.length;y++)for(let x=0;x<rows[y].length;x++){const ch=rows[y][x];if(ch>='0'&&ch<='3'){g.fillStyle=PAL[ch];g.fillRect(ox+x,oy+y,1,1);}}}
function sprite(rows){const c=cnv(rows[0].length,rows.length);paint(c.getContext('2d'),rows);return c;}
const mir=rows=>rows.map(r=>r+[...r].reverse().join(''));
function flipH(src){const c=cnv(src.width,src.height),g=c.getContext('2d');g.translate(src.width,0);g.scale(-1,1);g.drawImage(src,0,0);return c;}
function tint(src,col){const c=cnv(src.width,src.height),g=c.getContext('2d');g.drawImage(src,0,0);g.globalCompositeOperation='source-in';g.fillStyle=PAL[col];g.fillRect(0,0,c.width,c.height);return c;}
function tile8(rows){const c=cnv(16,16),g=c.getContext('2d');for(let i=0;i<4;i++)paint(g,rows,(i&1)*8,(i>>1)*8);return c;}
function shift8(rows,n){return rows.map(r=>r.slice(-n)+r.slice(0,-n));}
function layer(...parts){const c=cnv(16,16),g=c.getContext('2d');const p=(x,y,w,h,col)=>{g.fillStyle=PAL[col];g.fillRect(x,y,w,h);};
  for(const part of parts){ if(typeof part==='function') part(p,g); else if(part instanceof HTMLCanvasElement) g.drawImage(part,0,0); else paint(g,part);} return c;}

const P8={
  grass:['00000000','00000000','01010000','00100000','00000000','00000000','00000101','00000010'],
  tall:['11111111','21111112','12111121','12122121','11211211','21211212','12122121','11111111'],
  path:['00000000','00000000','00001000','00000000','00000000','01000000','00000000','00000010'],
  water:['22222222','22222222','21122112','12211221','22222222','22222222','22202222','22222222'],
  floor:['00000001','00000001','00000001','00000001','00000001','00000001','00000001','11111111'],
  roof:['22222223','22222223','22222223','33333333','22232222','22232222','22232222','33333333'],
  wall:['00000000','00000000','00000000','11111111','00000000','00000000','00000000','11111111'],
  iwall:['22232222','22232222','22232222','22232222','22232222','22232222','33333333','11111111'],
  rock:['33333333','11113111','11113111','11113111','33333333','31111111','31111111','31111111'],
  flowA:['00000000','00100000','01310000','00100000','00000000','00000100','00001310','00000100'],
  flowB:['00000000','01010000','00300000','01010000','00000000','00001010','00000300','00001010'],
};
const TREE=["....33333333....","..331111111133..",".31100111111113.",".31011111111113.","3111111111101113","3111111111011113","3111111111111113","3211111111111123","3221111111111223",".32211111111223.",".33222222222233.","..333322223333..",".....322223.....",".....322223.....","....33222233....","................"];
const BOULDER=["................",".....333333.....","...3311111133...","..311001111113..",".31101111111113.",".31111111111213.","3111111111112213","3111111111122213","3211111111222223","3221111112222223",".32222222222223.","..332222222233..","....33333333....","................","................","................"];
// items lying on the ground: a small furoshiki bundle
const BUNDLE=["................","................","......3..3......",".....3.33.3.....","......3333......","....33222233....","...3222112223...","...3221111223...","...3222222223...","...3221221223...","....32222223....",".....333333.....","................","................","................","................"];
// the binding thread spool (thrown in battle)
const SPOOL=["................","................","................","................","....33333333....","....32222223....",".....311113.....",".....310013.....",".....311113.....",".....310013.....",".....311113.....","....32222223....","....33333333....","................","................","................"];
// small paper lantern resting on the table

const TYPES=['無','火','水','木','金','土'];
const KOKU={'木':'土','土':'水','水':'火','火':'金','金':'木'};
function typeEff(mt,dts){return dts.reduce((a,dt)=>{
  if(mt==='無'||dt==='無'||mt==='ー') return a;
  if(KOKU[mt]===dt) return a*2;          // attacker overcomes defender
  if(KOKU[dt]===mt) return a*.5;         // defender overcomes attacker
  if(mt===dt) return a*.5;               // same element dampens itself
  return a;},1);}

function mkMon(sp,lv){const m={sp,lv,exp:expFor(lv),dv:[ri(0,15),ri(0,15),ri(0,15),ri(0,15),ri(0,15)],status:null,moves:movesAt(sp,lv).map(id=>({id,pp:MV[id].pp}))};calc(m);m.hp=m.mhp;return m;}

const layers=[];
const push=l=>(layers.push(l),l);
const pop=l=>{const i=layers.indexOf(l);if(i>=0)layers.splice(i,1);};
const timers=[];
const wait=n=>new Promise(r=>timers.push({t:FR+n,r}));
function txt(s,x,y,col=3,font=FONT){ctx.font=font;ctx.fillStyle=PAL[col];ctx.textBaseline='top';ctx.fillText(s,x,y);}
function txtR(s,x,y,col=3,font=FONT){ctx.font=font;ctx.textAlign='right';txt(s,x,y,col,font);ctx.textAlign='left';}
function drawBox(x,y,w,h){ctx.fillStyle=PAL[0];ctx.fillRect(x,y,w,h);ctx.fillStyle=PAL[3];
  ctx.fillRect(x+2,y+2,w-4,3);ctx.fillRect(x+2,y+h-5,w-4,3);ctx.fillRect(x+2,y+2,3,h-4);ctx.fillRect(x+w-5,y+2,3,h-4);
  ctx.fillStyle=PAL[2];ctx.fillRect(x+7,y+7,w-14,1);ctx.fillRect(x+7,y+h-8,w-14,1);ctx.fillRect(x+7,y+7,1,h-14);ctx.fillRect(x+w-8,y+7,1,h-14);}
function wrap(s,maxW=284){ctx.font=FONT;const out=[];
  for(const para of String(s).split('\n')){let line='';
    for(const tok of para.split(/(\s+)/)){ if(!tok) continue; const test=line+tok;
      if(ctx.measureText(test).width<=maxW){line=test;continue;}
      if(/^\s+$/.test(tok)){out.push(line);line='';continue;}
      if(line.trim()){out.push(line.trimEnd());line='';}
      for(const ch of tok){if(ctx.measureText(line+ch).width>maxW){out.push(line);line=ch;}else line+=ch;}
    } out.push(line.trimEnd());}
  return out;}
// say(): typewriter text box at the bottom. keep:true resolves once typed and leaves the box up (returns the layer).
function say(text,{keep=false,auto=0}={}){
  return new Promise(res=>{
    const lines=wrap(fmt(text)); let page=0, chars=0, wt=0;
    const pageLen=()=>(lines[page*2]||'').length+(lines[page*2+1]||'').length;
    const last=()=>page*2+2>=lines.length;
    const L={draw(){drawBox(0,192,320,96);let c=chars;
        for(let i=0;i<2;i++){const s=lines[page*2+i]||'';const n=Math.min(s.length,Math.max(0,Math.floor(c)));txt(s.slice(0,n),18,212+i*32);c-=s.length;}
        if(chars>=pageLen()&&!L.static&&(!last()||!auto)&&FR%32<20) txt('▼',290,262);},
      update(){
        if(L.static) return;
        if(chars<pageLen()){chars+=held('a')||held('b')?4:1.2; if(pressed('a')) chars=pageLen(); return;}
        if(last()&&keep){L.static=true;res(L);return;}
        if(last()&&auto){wt++; if(wt>=auto||pressed('a')||pressed('b')){pop(L);res();} return;}
        if(pressed('a')||pressed('b')){SFX.blip(); if(last()){pop(L);res();} else {page++;chars=0;}}
      }};
    push(L);
  });
}
async function ask(text,opts){const L=await say(text,{keep:true});const r=await yesno(opts);pop(L);return r;}
function menu(items,{x=0,y=0,w=0,cancel=true,start=0,lh=28,onMove=null,minW=0}={}){
  return new Promise(res=>{
    ctx.font=FONT; const lab=i=>typeof i==='string'?i:i.l;
    const ww=w||Math.max(minW,Math.max(...items.map(i=>ctx.measureText(lab(i)).width+(i.r?ctx.measureText(i.r).width+16:0)))+52);
    const hh=items.length*lh+22; let c=Math.min(start,items.length-1);
    const bx=Math.max(0,Math.min(x,W-ww)), by=Math.max(0,Math.min(y,H-hh));
    const L={draw(){drawBox(bx,by,ww,hh);items.forEach((it,i)=>{const yy=by+14+i*lh;txt(lab(it),bx+30,yy);if(it.r)txtR(it.r,bx+ww-16,yy);if(i===c)txt('▶',bx+12,yy);});},
      update(){const n=items.length;
        if(rep('down')){c=(c+1)%n;SFX.menu();onMove&&onMove(c);} else if(rep('up')){c=(c+n-1)%n;SFX.menu();onMove&&onMove(c);}
        else if(pressed('a')){SFX.blip();pop(L);res(c);} else if(cancel&&pressed('b')){pop(L);res(-1);} }};
    push(L); onMove&&onMove(c);
  });
}
async function yesno({x=224,y=118}={}){const r=await menu(['はい','いいえ'],{x,y,w:96});return r===0;}
function staticBox(drawFn){return push({draw:drawFn,update(){}});}
function hpBar(x,y,w,ratio){ctx.fillStyle=PAL[3];ctx.fillRect(x,y,w,7);ctx.fillStyle=PAL[0];ctx.fillRect(x+1,y+1,w-2,5);
  const f=Math.max(0,Math.min(1,ratio));if(f>0){ctx.fillStyle=f>.5?PAL[2]:f>.2?PAL[1]:PAL[3];ctx.fillRect(x+1,y+1,Math.max(1,Math.round((w-2)*f)),5);}}
let FADE={a:0,col:0};
async function fade(to,frames=10,col=0){FADE.col=col;const from=FADE.a;for(let i=1;i<=frames;i++){FADE.a=from+(to-from)*i/frames;await wait(1);}}

// ============================== WORLD ENGINE ==============================
const DIRS={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const OPP={up:'down',down:'up',left:'right',right:'left'};
let MAP=null, ENTS=[], scene='boot', busy=0;
const P={x:0,y:0,dir:'down',mov:null,spr:'player',phase:0,turn:0,bumpT:0};
function tileAt(x,y){if(x<0||y<0||x>=MAP.w||y>=MAP.h) return MAP.out?'T':'X'; return MAP.rows[y][x];}
function mkEnt(n){return {...n,dir:n.dir||'down',mov:null,home:[n.x,n.y],t:ri(60,200),phase:0,def:n};}
function refreshEnts(){
  const keep=new Map(ENTS.filter(e=>!e.temp&&e.def).map(e=>[e.def,e]));
  const next=[];
  for(const n of MAP.npcs||[]){ if(n.show&&!n.show()) continue; if(n.item&&S.flags[n.flag]) continue; next.push(keep.get(n)||mkEnt(n)); }
  ENTS=next.concat(ENTS.filter(e=>e.temp));
}
function loadMap(id,x,y,dir){const prev=MAP;MAP=MAPS[id];S.map=id;P.x=x;P.y=y;P.dir=dir||P.dir;P.mov=null;ENTS=[];refreshEnts();Music.play(MAP.music||'town');
  if(MAP.out&&prev!==MAP&&(!prev||!prev.out||prev.name!==MAP.name)){MAP_BANNER.s=MAP.name;MAP_BANNER.t=110;}}
async function warpTo(id,x,y,dir,{sound=true,frames=10}={}){busy++;if(sound)SFX.door();await fade(1,frames);loadMap(id,x,y,dir);await wait(2);await fade(0,frames);busy--;}
const entAt=(x,y)=>ENTS.find(e=>(e.x===x&&e.y===y)||(e.mov&&e.mov.tx===x&&e.mov.ty===y));
function blocked(x,y,self){
  if(SOLID.has(tileAt(x,y))) return true;
  if(ENTS.some(e=>e!==self&&((e.x===x&&e.y===y)||(e.mov&&e.mov.tx===x&&e.mov.ty===y)))) return true;
  if(self!==P&&((P.x===x&&P.y===y)||(P.mov&&P.mov.tx===x&&P.mov.ty===y))) return true;
  return false;
}
function startMove(e,dir,{jump=false,dur=12,cb=null}={}){const [dx,dy]=DIRS[dir];const n=jump?2:1;e.dir=dir;
  return new Promise(r=>{e.mov={fx:e.x,fy:e.y,tx:e.x+dx*n,ty:e.y+dy*n,t:0,d:jump?26:dur,jump,done:r,cb};});}
function stepMovers(){for(const e of [P,...ENTS]){if(!e.mov) continue;e.mov.t++;if(e.mov.t>=e.mov.d){const m=e.mov;e.x=m.tx;e.y=m.ty;e.mov=null;e.phase^=1;m.cb&&m.cb();m.done&&m.done();}}}
function entPx(e){if(!e.mov) return {x:e.x*TS,y:e.y*TS,j:0};const m=e.mov,f=m.t/m.d;return {x:Math.round((m.fx+(m.tx-m.fx)*f)*TS),y:Math.round((m.fy+(m.ty-m.fy)*f)*TS),j:m.jump?Math.round(Math.sin(f*Math.PI)*18):0};}
async function walk(e,dir,n=1){for(let i=0;i<n;i++){await startMove(e,dir);}}
function faceToward(e,t){const dx=t.x-e.x,dy=t.y-e.y;e.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');}

function worldInput(){
  if(P.mov) return;
  if(pressed('start')){run(startMenu);return;}
  if(pressed('a')){interact();return;}
  let d=null; for(const k of ['up','down','left','right']) if(held(k)) d=k;
  if(!d){P.turn=0;return;}
  if(d!==P.dir&&pressed(d)&&!P.wasMoving){P.dir=d;P.turn=5;return;}
  if(P.turn>0){P.turn--;return;}
  tryMove(d);
}
function tryMove(d){
  P.dir=d; const [dx,dy]=DIRS[d], nx=P.x+dx, ny=P.y+dy;
  const mat=MAP.warps.find(w=>w.mat&&w.x===P.x&&w.y===P.y);
  if(mat&&d==='down'){run(()=>warpTo(mat.to,mat.tx,mat.ty,mat.dir));return;}
  if(nx<0||ny<0||nx>=MAP.w||ny>=MAP.h){
    const c=MAP.conn[ny<0?'n':ny>=MAP.h?'s':nx<0?'w':'e'];
    if(c){const M2=MAPS[c.to];const tx=nx<0?M2.w-1:nx>=MAP.w?0:nx+c.dx, ty=ny<0?M2.h-1:ny>=MAP.h?0:ny;run(()=>warpTo(c.to,tx,ty,d,{sound:false,frames:6}));return;}
  }
  if(tileAt(nx,ny)==='L'&&d==='down'&&!blocked(nx,ny+1,P)){SFX.jump();P.wasMoving=true;startMove(P,d,{jump:true,cb:onStep});return;}
  if(blocked(nx,ny,P)){if(FR-P.bumpT>18){SFX.bump();P.bumpT=FR;}P.phase=(FR>>3)&1;return;}
  P.wasMoving=true; startMove(P,d,{cb:onStep});
}
function onStep(){
  S.steps++;
  if(S.steps%4===0){let hurt=false;for(const m of S.party){if(m.status==='psn'&&m.hp>1){m.hp--;hurt=true;if(m.hp===1){m.status=null;run(()=>say(`${NAME(m)}の どくは しぜんに なおった！`));}}} if(hurt){FADE.col=3;FADE.a=.35;setTimeout(()=>{if(FADE.a<.5)FADE.a=0;},60);}}
  const w=MAP.warps.find(w=>!w.mat&&w.x===P.x&&w.y===P.y);
  if(w){run(()=>warpTo(w.to,w.tx,w.ty,w.dir));return;}
  const tr=MAP.triggers.find(t=>t.t(P.x,P.y)&&(!t.c||t.c()));
  if(tr){run(tr.run);return;}
  if(checkTrainers()) return;
  if(tileAt(P.x,P.y)===','&&MAP.enc&&S.party.some(m=>m.hp>0)&&rnd()<1/(MAP.encRate||10)){run(wildEncounter);return;}
}
function checkTrainers(){
  for(const e of ENTS){ const T=e.trainer; if(!T||S.flags[T.flag]) continue; const [dx,dy]=DIRS[e.dir];
    for(let k=1;k<=T.sight;k++){const x=e.x+dx*k,y=e.y+dy*k; if(x===P.x&&y===P.y){run(()=>trainerSpotted(e));return true;} if(SOLID.has(tileAt(x,y))||entAt(x,y)) break;}}
  return false;
}
async function trainerSpotted(e){
  Music.stop(); SFX.alert(); e.emote=50; await wait(50);
  while(Math.abs(e.x-P.x)+Math.abs(e.y-P.y)>1) await walk(e,e.dir);
  P.dir=OPP[e.dir]; await trainerFight(e);
}
async function trainerFight(e){
  const T=e.trainer; await say(`${T.cls}の ${T.name}「${T.intro}」`);
  const r=await battle({kind:'trainer',trainer:T,party:T.party});
  if(r==='win'){S.flags[T.flag]=1;}
}
function interact(){
  const [dx,dy]=DIRS[P.dir], tx=P.x+dx, ty=P.y+dy;
  let e=entAt(tx,ty); if(!e&&(tileAt(tx,ty)==='c'||tileAt(tx,ty)==='t')) e=entAt(tx+dx,ty+dy);
  if(e){run(()=>talkTo(e));return;}
  const sg=MAP.signs[`${tx},${ty}`]; if(sg){run(()=>say(typeof sg==='function'?sg():sg));return;}
  const t=tileAt(tx,ty);
  if(t==='p') run(pcMenu);
  else if(t==='b') run(()=>say('むずかしそうな ほんが ぎっしり ならんでいる。'));
  else if(t==='v') run(()=>say('ラジオから まつりばやしが きこえてくる… ぴーひゃら どんどん。'));
  else if(t==='h') run(()=>say('ちいさな ほこら。 あたたかい ひかりが ヤドリを いやすと いう。'));
}
async function talkTo(e){
  if(e.spr&&!e.fixed) e.dir=OPP[P.dir]; else if(e.spr&&e.fixed&&e.trainer) e.dir=OPP[P.dir];
  if(e.trainer&&!S.flags[e.trainer.flag]){e.dir=OPP[P.dir];return trainerFight(e);}
  if(e.trainer) return say(`${e.trainer.cls}の ${e.trainer.name}「${e.trainer.after}」`);
  if(e.item){S.flags[e.flag]=1;addItem(e.item);SFX.buy();await say(`{P}は ${IT[e.item].n}を ひろった！`);return;}
  if(e.talk) return e.talk(e);
  if(e.text) return say(typeof e.text==='function'?e.text():e.text);
}
function npcWander(){
  for(const e of ENTS){ if(!e.walk||e.mov) continue; if(--e.t>0) continue; e.t=ri(70,200);
    const d=pick(['up','down','left','right']); const [dx,dy]=DIRS[d], nx=e.x+dx, ny=e.y+dy;
    e.dir=d; if(Math.abs(nx-e.home[0])>2||Math.abs(ny-e.home[1])>2) continue; if(blocked(nx,ny,e)||tileAt(nx,ny)===','||MAP.warps.some(w=>w.x===nx&&w.y===ny)) continue; startMove(e,d,{dur:16}); }
}
async function run(fn){busy++;try{await fn();}catch(err){console.error(err);}finally{busy--;if(MAP)refreshEnts();}}

function drawEnt(e,cx,cy){
  const p=entPx(e); const sx=p.x-cx, sy=p.y-cy-8-p.j;
  if(sx<-TS||sy<-TS||sx>W||sy>H) return;
  if(e.obj){ctx.drawImage(e.obj==='lantern'?IMG_KOCHO:IMG_BUNDLE,sx,sy+8,TS,TS);return;}
  const set=CH[e.spr]; if(!set) return; const fr=set[e.dir];
  let img=fr[0]; if(e.mov&&e.mov.t>e.mov.d*.25&&e.mov.t<e.mov.d*.85) img=(e.dir==='left'||e.dir==='right')?fr[1]:fr[1+e.phase];
  else if(e===P&&P.bumpT&&FR-P.bumpT<10) img=fr[1+P.phase];
  if(p.j){ctx.fillStyle=PAL[2];ctx.globalAlpha=.5;ctx.fillRect(sx+6,p.y-cy+24,20,4);ctx.globalAlpha=1;}
  ctx.drawImage(img,sx,sy+(e.mov&&img!==fr[0]?-2:0),TS,TS);
  if(!e.mov&&tileAt(e.x,e.y)===','){const t=TILES[','][0];ctx.drawImage(t,0,9,16,7,sx,p.y-cy+18,TS,14);}
  if(e.emote>0){e.emote--;ctx.drawImage(IMG_EMOTE,sx,sy-28,TS,TS);}
}
function drawWorld(){
  const pp=entPx(P), cx=pp.x-4*TS, cy=pp.y-4*TS;
  const tx0=Math.floor(cx/TS), ty0=Math.floor(cy/TS), af=(FR>>5)&1;
  for(let ty=ty0;ty<=ty0+9;ty++)for(let tx=tx0;tx<=tx0+10;tx++){const ch=tileAt(tx,ty);const fr=ch==='O'&&S.flags.lit?LANTERN_LIT:(TILES[ch]||TILES['X']);ctx.drawImage(fr[(ch==='O'?FR>>3:af)%fr.length],tx*TS-cx,ty*TS-cy,TS,TS);}
  const all=[...ENTS,P].sort((a,b)=>entPx(a).y-entPx(b).y);
  for(const e of all) drawEnt(e,cx,cy);
  if(MAP.fog&&!S.flags.lit){for(let ty=MAP.fog[0];ty<=MAP.fog[1];ty++)for(let tx=tx0;tx<=tx0+10;tx++){ctx.globalAlpha=Math.min(.95,.62+.18*Math.sin(tx*.9+ty*1.3+FR/45)+(MAP.fog[1]-ty)*.08);ctx.fillStyle=PAL[0];ctx.fillRect(tx*TS-cx,ty*TS-cy,TS,TS);}ctx.globalAlpha=1;}
  if(MAP.id==='town'&&!S.flags.lit){ctx.globalAlpha=.28;ctx.fillStyle=PAL[0];for(const ty of [0,1])for(let tx=tx0;tx<=tx0+10;tx++)ctx.fillRect(tx*TS-cx,ty*TS-cy,TS,TS);ctx.globalAlpha=1;}
  if(MAP_BANNER.t>0){MAP_BANNER.t--;ctx.font=FONT;drawBox(0,0,Math.min(320,ctx.measureText(MAP_BANNER.s).width+40),44);txt(MAP_BANNER.s,18,14);}
}

async function partnerQuiz(){
  const score={bonbori:0,shizuku:0,moegi:0};
  const Q=[
    ['まつりの よる。 さいしょに むかうのは？',['やたいの ひの まえ','いけの ほとり','ごしんぼくの した']],
    ['ともだちが ないている。 どうする？',['いっしょに おこる','だまって そばに いる','はなを つんで わたす']],
    ['いちばん すきな じかんは？',['まひるの おひさま','あめあがりの ゆうがた','しずかな あさ']],
  ];
  let lastPick=0;
  for(const [q,opts] of Q){
    const L=await say(`トワ「${q}」`,{keep:true});
    const k=await menu(opts,{x:56,y:64,w:264,cancel:false}); pop(L);
    score[PARTNERS[k]]++; lastPick=k;
  }
  let best=PARTNERS[lastPick]; for(const p of PARTNERS) if(score[p]>score[best]) best=p;
  return best;
}

  const evolvers=[...B.lv].map(i=>S.party[i]).filter(m=>m&&m.hp>0&&SPI[m.sp].evo&&m.lv>=SPI[m.sp].evo[0]);

  await say('となりの かじやの こ。 ちいさい ころから なにかと はりあってくる おさななじみの なまえは？',{keep:true}).then(L=>pop(L));
  c=await menu(['じぶんで きめる','ミオ','ソラ','ナギ'],{x:0,y:0,w:180,cancel:false});
  S.rival=c===0?await nameEntry('おさななじみの なまえは？','ミオ'):['','ミオ','ソラ','ナギ'][c];
  INTRO.spr=CH.player.down[0];
  await say('こよいは ひだまり村の ともしびまつり。 {P}と {R}の たびが いま はじまろうと していた…');
  await fade(1,24,0); loadMap('house1',2,5,'up'); scene='world'; await fade(0,24,0);
  await say('（メニューは Enterキー か MENUボタン。 しらべる・はなす は けっていキー だよ）');
}

// ============================== MAIN LOOP ==============================
function render(){
  if(scene==='world'&&MAP) drawWorld();
  else if(scene==='battle') drawBattle();
  else if(scene==='title') drawTitle();
  else if(scene==='intro') drawIntro();
  else if(scene==='evo') drawEvo();
  else if(scene==='ending') drawEnding();
  else {ctx.fillStyle=PAL[scene==='black'?3:0];ctx.fillRect(0,0,W,H);}
  if(TR.t>0){ctx.fillStyle=PAL[3];const h=Math.ceil(TR.t*18);for(let y=0;y<H;y+=18)ctx.fillRect(0,y,W,h);}
  let start=0; for(let i=layers.length-1;i>=0;i--) if(layers[i].full){start=i;break;}
  for(let i=start;i<layers.length;i++) layers[i].draw();
  if(FADE.a>0){ctx.globalAlpha=Math.min(1,FADE.a);ctx.fillStyle=PAL[FADE.col];ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}
}
function tick(){
  pollInput(); FR++; if(S) S.time++;
  for(let i=timers.length-1;i>=0;i--) if(timers[i].t<=FR){const t=timers.splice(i,1)[0];t.r();}
  if(layers.length) layers[layers.length-1].update();
  else if(scene==='world'&&!busy&&MAP) worldInput();
  if(scene==='world'&&MAP){ if(!P.mov&&!['up','down','left','right'].some(held)) P.wasMoving=false; stepMovers(); if(!busy&&!layers.length) npcWander(); }
  Music.tick(); render(); endInput();
}
let last=performance.now(), acc=0;
function loop(now){acc+=Math.min(100,now-last);last=now;while(acc>=1000/60){for(let i=0;i<(window.__SPEED||1);i++)tick();acc-=1000/60;}requestAnimationFrame(loop);}
window.__G={get S(){return S;},set S(v){S=v;},MAPS,SP,SPI,MV,P,get MAP(){return MAP;},get B(){return B;},get scene(){return scene;},layers,loadMap,mkMon,giveMon,run,battle,K,VK,TAP,typeEff};
(async function boot(){
  try{await Promise.race([document.fonts.load(FONT),new Promise(r=>setTimeout(r,2500))]);}catch(e){}
  requestAnimationFrame(loop);
  cv.focus();
  while(true){ await titleFlow(); break; }
})();
cv.addEventListener('pointerdown',()=>{cv.focus();unlockAudio();});
</script>
